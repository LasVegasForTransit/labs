name: Preview
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
permissions:
  contents: read
  packages: read
  deployments: write
  pull-requests: write
concurrency:
  group: labs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  policy:
    if:
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.CLOUDFLARE_PREVIEWS_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.policy.outputs.matrix }}
      has-previews: ${{ steps.policy.outputs.has-previews }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref:
            ${{ github.event.action == 'closed' && github.event.repository.default_branch ||
            github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - id: policy
        env:
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run:
          pnpm exec tsx packages/labs-cli/src/pr-release-policy.ts --action "$ACTION" --base "$BASE"
          --head "$HEAD"
  preview:
    needs: policy
    if: needs.policy.outputs.has-previews == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.policy.outputs.matrix) }}
    uses: LasVegasForTransit/repository-tooling/.github/workflows/release-pr-preview.yml@3567f0cb1345e8756eb5d84e0a3ea7b62695125a
    with:
      enabled: true
      app: ${{ matrix.app }}
      publication-mode: named-staging
      preview-environment: preview
      protection: public
      app-directory: ${{ matrix.appDirectory }}
      preview-script: api
      smoke-script: api
      acceptance-directory: packages/labs-cli
      browser-script: preview:acceptance
    secrets: inherit
