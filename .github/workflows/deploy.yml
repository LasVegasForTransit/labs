# Main builds protected staging only. Production promotion requires a separate manual dispatch.
name: Stage Labs release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: 'Explicit profile; draft profiles permit manual preview only'
        type: string
        default: home

permissions:
  contents: read
  packages: read
  actions: read
  deployments: write

concurrency:
  group: labs-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.policy.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Select Labs-owned eligible profiles
        id: policy
        env:
          APP: ${{ inputs.app }}
          EVENT: ${{ github.event_name }}
        run:
          pnpm exec tsx packages/labs-cli/src/release-policy-command.ts --target preview --event
          "$EVENT" --app "$APP"
  build:
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.policy.outputs.matrix) }}
    uses: LasVegasForTransit/repository-tooling/.github/workflows/release-build.yml@3567f0cb1345e8756eb5d84e0a3ea7b62695125a
    with:
      app: ${{ matrix.app }}
      app-directory: ${{ matrix.appDirectory }}
      artifact-prefix: ${{ matrix.artifactPrefix }}
      artifact-source: typed-worker
      validation-browser-directory: .
      build-environment: production
      require-analytics: true
    secrets: inherit
  attest:
    needs: [policy, build]
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.policy.outputs.matrix) }}
    uses: LasVegasForTransit/repository-tooling/.github/workflows/release-attest.yml@3567f0cb1345e8756eb5d84e0a3ea7b62695125a
    with:
      app: ${{ matrix.app }}
      artifact-prefix: ${{ matrix.artifactPrefix }}
    secrets: inherit
  preview:
    needs: [policy, build, attest]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.policy.outputs.matrix) }}
    uses: LasVegasForTransit/repository-tooling/.github/workflows/release-publish.yml@3567f0cb1345e8756eb5d84e0a3ea7b62695125a
    with:
      app: ${{ matrix.app }}
      target: preview
      publication-mode: named-staging
      attestation-prefix: attestation-${{ matrix.artifactPrefix }}
      release-id: ${{ github.run_id }}
      commit: ${{ github.sha }}
      artifact-prefix: ${{ matrix.artifactPrefix }}
      app-directory: ${{ matrix.appDirectory }}
      acceptance-directory: packages/labs-cli
      preview-environment: preview
      production-environment: production
      url: https://lvbt-labs-${{ matrix.app }}-staging.las-vegas-for-better-transit.workers.dev
      smoke-script: release:smoke
      browser-script: test:release
      browser-project: desktop
    secrets: inherit
