# Deploys affected active and deprecated labs after validation.
# Requires CLOUDFLARE_API_TOKEN in the production environment.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Deploy affected apps
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          if [ "$CURRENT" != "$GITHUB_SHA" ]; then
            # Not a failure: the newer commit's own run deploys, and this one must not.
            echo "::notice::This commit was superseded on main; its newer run deploys instead."
            exit 0
          fi
          # Save the history to a file rather than piping gh into Node: on Node 24.21.0 the pipe
          # made this step abort with glibc heap corruption ("corrupted double-linked list").
          RUNS="$RUNNER_TEMP/deploy-runs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs" \
            --method GET -f branch=main -f per_page=100 > "$RUNS"
          BASE=$(pnpm exec tsx packages/labs-cli/src/deployment-baseline.ts "$RUNS")
          if [ -n "$BASE" ]; then
            pnpm deploy:affected --base "$BASE" --apply --json
          else
            pnpm deploy:affected --all --apply --json
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LVBT_REQUIRE_ANALYTICS: '1'
          PUBLIC_LVBT_CWA_TOKEN: ${{ vars.PUBLIC_LVBT_CWA_TOKEN }}

      - name: Preserve deployment receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: .wrangler/deployments/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90

